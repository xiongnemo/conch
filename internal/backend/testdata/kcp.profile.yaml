# mKCP：mihomo 只给 vmess，xray 都有，sing-box 没有
nodes:
  - { name: 默认, type: vmess, server: 192.0.2.70, port: 4000, uuid: 00000000-0000-0000-0000-000000000070, alterId: 0, cipher: auto, udp: true, network: mkcp }
  - { name: 伪装加密, type: vmess, server: 192.0.2.71, port: 4000, uuid: 00000000-0000-0000-0000-000000000071, alterId: 0, cipher: auto, network: kcp,
      mkcp-opts: { mtu: 1200, tti: 20, uplink-capacity: 10, downlink-capacity: 50, congestion: true, write-buffer: 4194304, header: wechat-video, seed: s33d } }
  - { name: 只伪装, type: vmess, server: 192.0.2.72, port: 4000, uuid: 00000000-0000-0000-0000-000000000072, alterId: 0, cipher: auto, network: mkcp,
      tls: true, servername: k.example.com, mkcp-opts: { header: dtls } }

routes:
  default: 默认
  entries:
    a.example: 伪装加密
    b.example: 只伪装
