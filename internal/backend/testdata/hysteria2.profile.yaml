# hysteria2 的常见写法，三个内核都要能编译，并交给各自的真实内核检查
# （protocols.profile.yaml 里有 sing-box 不支持的节点，sing-box 不会为它生成配置）
nodes:
  - { name: 单端口, type: hysteria2, server: h.example.com, port: 443, password: p, sni: h.example.com }
  # 分享链接 h.example.com:443,20000-30000 解析出的端口跳跃
  - { name: 端口跳跃, type: hysteria2, server: h.example.com, port: 443, password: p, sni: h.example.com,
      ports: "443,20000-30000", hop-interval: 30, obfs: salamander, obfs-password: o, up: 50, down: 200 }
  - { name: 跳一个端口, type: hysteria2, server: 192.0.2.9, port: 8443, password: p, ports: "8443" }
  - { name: 入口, type: socks5, server: 192.0.2.7, port: 1080, udp: true }

chains:
  经入口: [入口, 单端口]

routes:
  default: 端口跳跃
  entries:
    a.example: 跳一个端口
    b.example: 经入口
