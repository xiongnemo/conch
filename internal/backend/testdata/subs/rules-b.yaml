# A subscription whose rules come in long runs to one exit, like most
# real ones: xray gets one rule per run.
proxies:
  - { name: B1, type: socks5, server: 192.0.2.21, port: 1080 }
  - { name: B2, type: socks5, server: 192.0.2.22, port: 1080 }
proxy-groups:
  - { name: 代理, type: select, proxies: [B1, B2] }
rules:
  - DOMAIN-SUFFIX,a.example,代理
  - DOMAIN,b.example,代理
  - DOMAIN-KEYWORD,cexample,代理
  - DOMAIN-SUFFIX,d.example,DIRECT
  - IP-CIDR,192.0.2.0/24,DIRECT,no-resolve
  - IP-CIDR,198.51.100.0/24,DIRECT,no-resolve
  - DOMAIN-SUFFIX,e.example,DIRECT
  - DOMAIN-SUFFIX,f.example,代理
  - DST-PORT,80/443,DIRECT
  - MATCH,代理
