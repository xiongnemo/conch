# WireGuard：经由隧道解析域名（remote-dns-resolve）、只发垃圾包的 AmneziaWG（xray 用 noise 掩码；sing-box 没有）；
# 还有 MASQUE（Cloudflare WARP 那样的 CONNECT-IP，sing-box 没有；密钥是测试用的，不对应任何服务器）
nodes:
  - { name: 远程解析, type: wireguard, server: 192.0.2.60, port: 51820, ip: 172.16.0.2, udp: true, remote-dns-resolve: true, dns: [1.1.1.1, "tls://8.8.8.8"],
      private-key: elM/+PBAa7rn1rifSGuVKiDD9gSiGddGjleV+taVs0U=, public-key: DHZ/8quR7djJIv0jvfkP2aGcbDWdOpjd0opJwa0pM2E= }
  - { name: 垃圾包, type: wireguard, server: 192.0.2.61, port: 51820, ip: 172.16.0.3, udp: true, ip-version: ipv4,
      amnezia-wg-option: { jc: 3, jmin: 40, jmax: 70 },
      private-key: elM/+PBAa7rn1rifSGuVKiDD9gSiGddGjleV+taVs0U=, public-key: DHZ/8quR7djJIv0jvfkP2aGcbDWdOpjd0opJwa0pM2E= }

  - { name: masque, type: masque, server: 162.159.198.1, port: 443, ip: 172.16.0.4, ipv6: "2606:4700:110:8a36::4", udp: true,
      private-key: "MHcCAQEEIEUvGBZ5Rz3yCU/mgvKT1c5vlhqRMPfz/4OrPnabnJYUoAoGCCqGSM49AwEHoUQDQgAEsYXpzccGP6PvCe6xTqGbB1ghJ+y0gV/6x6rqSHlrTYRj4YpjRCvD+Fut7t1iZKsCZnBxsM1OZpHm3Gw+qEv3VQ==",
      public-key: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2b6Sd7M3zXzGk47L30eUaqJhIWgRpu4tNQRsRV27CZqO/jcRt/Us7ECdwsjztBqYCP3ZZArx7Mc8Yrlz4BWmog==" }

routes:
  default: 远程解析
  entries:
    a.example: 垃圾包
    b.example: masque
