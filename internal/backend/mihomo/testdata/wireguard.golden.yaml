    type: wireguard
    server: 192.0.2.61
    port: 51820
    ip: 172.16.0.3
    udp: true
    ip-version: ipv4
    amnezia-wg-option:
      jc: 3
      jmin: 40
      jmax: 70
    private-key: elM/+PBAa7rn1rifSGuVKiDD9gSiGddGjleV+taVs0U=
    public-key: DHZ/8quR7djJIv0jvfkP2aGcbDWdOpjd0opJwa0pM2E=
