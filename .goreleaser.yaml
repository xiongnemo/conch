# Release builds, run by .github/workflows/release.yml with the version tag
# (docs/versioning.md) checked out. Try it locally with
# `goreleaser release --snapshot --clean --skip=sign`.
version: 2
project_name: conch

before:
  hooks:
    - go mod download
    # The browser extension, zipped for the Chrome Web Store and AMO.
    - sh -c "cd extension && npm ci --no-audit --no-fund && CONCH_EXT_VERSION={{ .Major }}.{{ .Minor }}.{{ .Patch }} npm run build"
    - sh -c "rm -rf dist-extension && mkdir dist-extension && cd extension/dist/chrome && zip -qr ../../../dist-extension/conch-extension-chrome-{{ .Version }}.zip . && cd ../firefox && zip -qr ../../../dist-extension/conch-extension-firefox-{{ .Version }}.zip ."

builds:
  - id: conch
    main: ./cmd/conch
    binary: conch
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    # scripts/version.sh --ldflags, set by the release workflow
    ldflags: ["-s -w {{ index .Env \"CONCH_LDFLAGS\" }}"]
    targets:
      - linux_amd64_v1
      - linux_arm64
      - linux_arm_7
      - linux_386
      - linux_riscv64
      # Routers: OpenWrt on MIPS without an FPU.
      - linux_mipsle_softfloat
      - linux_mips_softfloat
      - darwin_amd64_v1
      - darwin_arm64
      - windows_amd64_v1
      - windows_arm64
      - freebsd_amd64_v1
  # For routers (OpenWrt): no TUI, and a memory limit for small RAM.
  - id: conch-lite
    main: ./cmd/conch
    binary: conch
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    tags: [lite]
    # scripts/version.sh --ldflags, set by the release workflow
    ldflags: ["-s -w {{ index .Env \"CONCH_LDFLAGS\" }}"]
    targets:
      - linux_arm64
      - linux_arm_7
      - linux_mipsle_softfloat
      - linux_mips_softfloat

archives:
  - ids: [conch]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}
    files:
      - examples/profile.yaml
  - id: lite
    ids: [conch-lite]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}-lite_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}
    files:
      - examples/profile.yaml

checksum:
  name_template: checksums.txt

nfpms:
  - package_name: conch
    ids: [conch]
    maintainer: Nemo Xiong <nemo@anzupop.com>
    homepage: https://github.com/xiongnemo/conch
    description: Routing-table proxy shell with multi-hop chains, for the mihomo, xray and sing-box kernels.
    formats: [deb, rpm, apk, archlinux]
    # For a prerelease the release workflow adds `prerelease: pre` here (it
    # is not a template), packaging it as 0.0.5~pre (apk: 0.0.5_pre), below
    # the release 0.0.5: apk-tools calls 0.0.5_main-<commit> invalid.
    bindir: /usr/bin
    contents:
      - src: examples/profile.yaml
        dst: /usr/share/doc/conch/profile.example.yaml

# A keyless signature (Sigstore) for the checksums, which cover every
# artifact; the README shows how to verify it.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]
    artifacts: checksum

# Created as a draft on the commit built; the workflow then publishes it as
# a release or a prerelease (docs/versioning.md).
release:
  draft: true
  target_commitish: "{{ .FullCommit }}"
  extra_files:
    - glob: ./dist-extension/*.zip

changelog:
  sort: asc
