# Release builds. CI runs `goreleaser release --clean` on version tags;
# try it locally with `goreleaser release --snapshot --clean --skip=sign`.
version: 2
project_name: nautilus

before:
  hooks:
    - go mod download
    # The browser extension, zipped for the Chrome Web Store and AMO.
    - sh -c "cd extension && npm ci --no-audit --no-fund && npm run build"
    - sh -c "rm -rf dist-extension && mkdir dist-extension && cd extension/dist/chrome && zip -qr ../../../dist-extension/nautilus-extension-chrome-{{ .Version }}.zip . && cd ../firefox && zip -qr ../../../dist-extension/nautilus-extension-firefox-{{ .Version }}.zip ."

builds:
  - id: nautilus
    main: ./cmd/nautilus
    binary: nautilus
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    targets:
      - linux_amd64_v1
      - linux_arm64
      - linux_arm_7
      - linux_386
      - linux_riscv64
      # Routers: OpenWrt on MIPS without an FPU.
      - linux_mipsle_softfloat
      - linux_mips_softfloat
      - darwin_amd64_v1
      - darwin_arm64
      - windows_amd64_v1
      - windows_arm64
      - freebsd_amd64_v1
  # For routers (OpenWrt): no TUI, and a memory limit for small RAM.
  - id: nautilus-lite
    main: ./cmd/nautilus
    binary: nautilus
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    tags: [lite]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    targets:
      - linux_arm64
      - linux_arm_7
      - linux_mipsle_softfloat
      - linux_mips_softfloat

archives:
  - ids: [nautilus]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}
    files:
      - examples/profile.yaml
  - id: lite
    ids: [nautilus-lite]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}-lite_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}
    files:
      - examples/profile.yaml

checksum:
  name_template: checksums.txt

nfpms:
  - package_name: nautilus
    ids: [nautilus]
    maintainer: Nemo Xiong <nemo@anzupop.com>
    homepage: https://github.com/xiongnemo/nautilus
    description: Routing-table proxy shell with multi-hop chains, for the mihomo, xray and sing-box kernels.
    formats: [deb, rpm, apk, archlinux]
    bindir: /usr/bin
    contents:
      - src: examples/profile.yaml
        dst: /usr/share/doc/nautilus/profile.example.yaml

# A keyless signature (Sigstore) for the checksums, which cover every
# artifact; the README shows how to verify it.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]
    artifacts: checksum

release:
  draft: true
  extra_files:
    - glob: ./dist-extension/*.zip

changelog:
  sort: asc
