name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Goldens are up to date
        run: |
          go test ./internal/backend/... -run TestGolden -update
          test -z "$(git status --porcelain)" || { git status --porcelain; git diff; exit 1; }
      - name: Install mihomo, xray and trojan-go, verified against the embedded checksums
        run: |
          go build -o /tmp/nautilus ./cmd/nautilus
          /tmp/nautilus kernel install mihomo
          /tmp/nautilus kernel install xray --geodata
          /tmp/nautilus kernel install trojan-go
          {
            echo "NAUTILUS_MIHOMO=$(/tmp/nautilus kernel path mihomo)"
            echo "NAUTILUS_XRAY=$(/tmp/nautilus kernel path xray)"
            echo "NAUTILUS_TROJAN_GO=$(/tmp/nautilus kernel path trojan-go)"
            echo "NAUTILUS_XRAY_ASSETS=$HOME/.local/share/nautilus/home/xray"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Browser extension builds and its tests pass
        working-directory: extension
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Kernels accept every golden config; daemon, API and extension work end to end
        run: |
          export NAUTILUS_CHROME="$(command -v google-chrome)" NAUTILUS_EXTENSION="$PWD/extension/dist/chrome"
          go test ./internal/backend/... ./internal/e2e -count=1 -v

  cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - linux/arm
          - linux/mipsle
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
          - windows/arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build ${{ matrix.target }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CGO_ENABLED: "0"
          GOARM: "7"
          GOMIPS: softfloat
        run: |
          export GOOS=${TARGET%/*} GOARCH=${TARGET#*/}
          go build -trimpath -ldflags "-s -w" -o /tmp/nautilus ./cmd/nautilus
