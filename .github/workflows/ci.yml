name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Goldens are up to date
        run: |
          go test ./internal/backend/mihomo -run TestGolden -update
          git diff --exit-code
      - name: Install mihomo, verified against the embedded checksums
        run: |
          go run ./cmd/nautilus kernel install
          echo "NAUTILUS_MIHOMO=$(go run ./cmd/nautilus kernel path)" >> "$GITHUB_ENV"
      - name: mihomo accepts every golden config, chains work end to end
        run: go test ./internal/backend/mihomo ./internal/e2e -run 'Mihomo|Chain' -count=1 -v

  cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - linux/arm
          - linux/mipsle
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
          - windows/arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build ${{ matrix.target }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CGO_ENABLED: "0"
          GOARM: "7"
          GOMIPS: softfloat
        run: |
          export GOOS=${TARGET%/*} GOARCH=${TARGET#*/}
          go build -trimpath -ldflags "-s -w" -o /tmp/nautilus ./cmd/nautilus
