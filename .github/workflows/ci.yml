name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Superseded runs on branches are cancelled; every commit on main gets a result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          test -z "$files" || { echo "Run gofmt -w on:"; echo "$files"; exit 1; }
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: go vet, for every OS and for the lite build
        run: |
          for os in linux darwin windows freebsd; do
            echo "GOOS=$os"
            GOOS=$os go vet ./...
          done
          go vet -tags lite ./...
      - name: Goldens are up to date
        run: |
          go test ./internal/backend/... -run TestGolden -update
          test -z "$(git status --porcelain)" || { git status --porcelain; git diff; exit 1; }

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test
        shell: bash
        # -race needs cgo; Linux and macOS cover it, Windows runs the plain tests.
        run: go test ${{ runner.os != 'Windows' && '-race' || '' }} ./...

  e2e:
    name: e2e (real kernels and Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Build the browser extension
        working-directory: extension
        run: |
          npm ci
          npm run build
      - name: Install mihomo, xray, sing-box and trojan-go, verified against the embedded checksums
        run: |
          go build -o /tmp/conch ./cmd/conch
          /tmp/conch kernel install mihomo
          /tmp/conch kernel install xray --geodata
          /tmp/conch kernel install sing-box
          /tmp/conch kernel install trojan-go
          {
            echo "CONCH_MIHOMO=$(/tmp/conch kernel path mihomo)"
            echo "CONCH_XRAY=$(/tmp/conch kernel path xray)"
            echo "CONCH_XRAY_ASSETS=$HOME/.local/share/conch/home/xray"
            echo "CONCH_SING_BOX=$(/tmp/conch kernel path sing-box)"
            echo "CONCH_TROJAN_GO=$(/tmp/conch kernel path trojan-go)"
            echo "CONCH_CHROME=$(command -v google-chrome)"
            echo "CONCH_EXTENSION=$PWD/extension/dist/chrome"
          } >> "$GITHUB_ENV"
      - name: Kernels accept every golden config; daemon, API, sidecars and extension work end to end
        shell: bash
        run: |
          go test -race -count=1 -v ./internal/backend/... ./internal/e2e ./internal/sidecar | tee e2e.log
          # Tests skip when a kernel or the browser is missing; here that is a
          # failure. TUN has a job of its own.
          if grep -- '--- SKIP' e2e.log | grep -v TestTUN; then exit 1; fi

  # TUN and the system service need root, which the runners have. TUN runs
  # in a network namespace with nothing but a local address, so it cannot
  # take the runner's own network away.
  e2e-root:
    name: e2e (linux, root - TUN, service)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install mihomo, xray and sing-box
        run: |
          go build -o /tmp/conch ./cmd/conch
          for k in mihomo xray sing-box; do /tmp/conch kernel install $k; done
          {
            echo "CONCH_MIHOMO=$(/tmp/conch kernel path mihomo)"
            echo "CONCH_XRAY=$(/tmp/conch kernel path xray)"
            echo "CONCH_SING_BOX=$(/tmp/conch kernel path sing-box)"
          } >> "$GITHUB_ENV"
      - name: TUN, in a network namespace of its own
        shell: bash
        run: |
          go test -c -o /tmp/e2e.test ./internal/e2e
          sudo ip netns add nt
          sudo ip -n nt link set lo up
          sudo ip -n nt link add dummy0 type dummy
          sudo ip -n nt addr add 10.200.0.2/24 dev dummy0
          sudo ip -n nt link set dummy0 up
          sudo ip -n nt route add default via 10.200.0.1 dev dummy0
          # Programs in the namespace ask a resolver only TUN answers.
          sudo mkdir -p /etc/netns/nt
          echo "nameserver 10.200.0.53" | sudo tee /etc/netns/nt/resolv.conf
          sudo ip netns exec nt env CONCH_TUN_TEST=10.200.0.2 CONCH_MIHOMO="$CONCH_MIHOMO" CONCH_XRAY="$CONCH_XRAY" CONCH_SING_BOX="$CONCH_SING_BOX" \
            /tmp/e2e.test -test.run TestTUN -test.v -test.count=1 | tee tun.log
          if grep -- '--- SKIP' tun.log; then exit 1; fi
      - name: System service (systemd)
        shell: bash
        run: |
          mkdir -p ~/.config/conch
          printf 'routes: { default: DIRECT }\ninbound: { mixed-port: 7890 }\n' > ~/.config/conch/profile.yaml
          printf 'CONCH_PASSWORD=ci-service\n' > ~/.config/conch/.env
          sudo /tmp/conch service install --no-agent
          for i in $(seq 1 60); do /tmp/conch status 2>/dev/null | grep -q 运行中 && break; sleep 1; done
          /tmp/conch status
          /tmp/conch service status
          systemctl show conch -p User -p AmbientCapabilities -p WorkingDirectory
          test "$(curl -s -m 20 -x http://127.0.0.1:7890 -o /dev/null -w '%{http_code}' https://www.google.com/generate_204)" = 204
          sudo /tmp/conch service uninstall
          if systemctl is-active --quiet conch; then exit 1; fi

  # The daemon on Windows: controllers over unix sockets, Job Objects,
  # kernels' Windows builds.
  e2e-windows:
    name: e2e (windows, real kernels)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install mihomo, xray, sing-box and trojan-go
        shell: bash
        run: |
          go build -o conch.exe ./cmd/conch
          for k in mihomo sing-box trojan-go; do ./conch.exe kernel install $k; done
          ./conch.exe kernel install xray --geodata
          {
            echo "CONCH_MIHOMO=$(./conch.exe kernel path mihomo)"
            echo "CONCH_XRAY=$(./conch.exe kernel path xray)"
            echo "CONCH_XRAY_ASSETS=$LOCALAPPDATA\\conch\\home\\xray"
            echo "CONCH_SING_BOX=$(./conch.exe kernel path sing-box)"
            echo "CONCH_TROJAN_GO=$(./conch.exe kernel path trojan-go)"
          } >> "$GITHUB_ENV"
      - name: Kernels accept every golden config; daemon, API and sidecars work end to end
        shell: bash
        run: |
          go test -count=1 -v ./internal/backend/... ./internal/e2e ./internal/sidecar | tee e2e.log
          # Only the extension test may skip: Go cannot hand Chrome its
          # debugging pipe on Windows.
          if grep -- '--- SKIP' e2e.log | grep -v TestExtension; then exit 1; fi

  # The daemon on macOS: no death signal reaches the kernel (pid files
  # instead), unix socket paths are short, the kernels' darwin builds.
  e2e-macos:
    name: e2e (macos, real kernels and Chrome)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Build the browser extension
        working-directory: extension
        run: |
          npm ci
          npm run build
      - name: Install mihomo, xray, sing-box and trojan-go
        run: |
          go build -o /tmp/conch ./cmd/conch
          export CONCH_DATA_DIR="$RUNNER_TEMP/conch-data"
          for k in mihomo sing-box trojan-go; do /tmp/conch kernel install $k; done
          /tmp/conch kernel install xray --geodata
          {
            echo "CONCH_MIHOMO=$(/tmp/conch kernel path mihomo)"
            echo "CONCH_XRAY=$(/tmp/conch kernel path xray)"
            echo "CONCH_XRAY_ASSETS=$CONCH_DATA_DIR/home/xray"
            echo "CONCH_SING_BOX=$(/tmp/conch kernel path sing-box)"
            echo "CONCH_TROJAN_GO=$(/tmp/conch kernel path trojan-go)"
            echo "CONCH_CHROME=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
            echo "CONCH_EXTENSION=$PWD/extension/dist/chrome"
          } >> "$GITHUB_ENV"
      - name: Kernels accept every golden config; daemon, API, sidecars and extension work end to end
        shell: bash
        run: |
          go test -race -count=1 -v ./internal/backend/... ./internal/e2e ./internal/sidecar | tee e2e.log
          if grep -- '--- SKIP' e2e.log | grep -v TestTUN; then exit 1; fi

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Type check, test and build
        working-directory: extension
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      # Mozilla's linter checks the Firefox build the way addons.mozilla.org does.
      - name: Lint the Firefox build
        working-directory: extension
        run: npx --yes web-ext@8 lint --source-dir dist/firefox --self-hosted --warnings-as-errors
      # Unzip and load chrome/ (Chrome, Edge) or firefox/ as an unpacked extension.
      - uses: actions/upload-artifact@v7
        with:
          name: conch-extension
          path: extension/dist/
          retention-days: 14

  # Binaries of this commit for trying it out, one artifact per platform.
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.lite && ', lite' || '' }})
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: linux, goarch: arm64, lite: true }
          - { goos: linux, goarch: mipsle, lite: true }
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        id: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          GOMIPS: softfloat
          TAGS: ${{ matrix.lite && 'lite' || '' }}
        run: |
          name=conch${TAGS:+-$TAGS}_${GOOS}_${GOARCH}
          if [ "$GOOS" = windows ]; then name=$name.exe; fi
          go build -trimpath -tags "$TAGS" -ldflags "-s -w -X main.version=dev-${GITHUB_SHA::7}" -o "out/$name" ./cmd/conch
          echo "file=out/$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.file }}
          archive: false
          retention-days: 14

  # What the release workflow does on a tag, without signing or publishing:
  # every target, the lite builds, packages and the extension zips.
  release:
    name: release dry run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          install-only: true
      - run: goreleaser check
      - run: goreleaser release --snapshot --clean --skip=sign
