name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Superseded runs on branches are cancelled; every commit on main gets a result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          test -z "$files" || { echo "Run gofmt -w on:"; echo "$files"; exit 1; }
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: go vet, for every OS and for the lite build
        run: |
          for os in linux darwin windows freebsd; do
            echo "GOOS=$os"
            GOOS=$os go vet ./...
          done
          go vet -tags lite ./...
      - name: Goldens are up to date
        run: |
          go test ./internal/backend/... -run TestGolden -update
          test -z "$(git status --porcelain)" || { git status --porcelain; git diff; exit 1; }

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test
        shell: bash
        # -race needs cgo; Linux and macOS cover it, Windows runs the plain tests.
        run: go test ${{ runner.os != 'Windows' && '-race' || '' }} ./...

  e2e:
    name: e2e (real kernels and Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Build the browser extension
        working-directory: extension
        run: |
          npm ci
          npm run build
      - name: Install mihomo, xray, sing-box and trojan-go, verified against the embedded checksums
        run: |
          go build -o /tmp/conch ./cmd/conch
          /tmp/conch kernel install mihomo
          /tmp/conch kernel install xray --geodata
          /tmp/conch kernel install sing-box
          /tmp/conch kernel install trojan-go
          {
            echo "CONCH_MIHOMO=$(/tmp/conch kernel path mihomo)"
            echo "CONCH_XRAY=$(/tmp/conch kernel path xray)"
            echo "CONCH_XRAY_ASSETS=${XDG_DATA_HOME:-$HOME/.local/share}/conch/home/xray"
            echo "CONCH_SING_BOX=$(/tmp/conch kernel path sing-box)"
            echo "CONCH_TROJAN_GO=$(/tmp/conch kernel path trojan-go)"
            echo "CONCH_CHROME=$(command -v google-chrome)"
            echo "CONCH_EXTENSION=$PWD/extension/dist/chrome"
          } >> "$GITHUB_ENV"
      - name: Kernels accept every golden config; daemon, API, sidecars and extension work end to end
        shell: bash
        run: |
          go test -race -count=1 -v ./internal/backend/... ./internal/e2e ./internal/sidecar ./cmd/conch | tee e2e.log
          # Tests skip when a kernel or the browser is missing; here that is a
          # failure. TUN has a job of its own.
          if grep -- '--- SKIP' e2e.log | grep -v TestTUN; then exit 1; fi

  # TUN and the system service need root, which the runners have. TUN runs
  # in a network namespace with nothing but a local address, so it cannot
  # take the runner's own network away.
  e2e-root:
    name: e2e (linux, root - TUN, service)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install mihomo, xray and sing-box
        run: |
          go build -o /tmp/conch ./cmd/conch
          for k in mihomo xray sing-box; do /tmp/conch kernel install $k; done
          {
            echo "CONCH_MIHOMO=$(/tmp/conch kernel path mihomo)"
            echo "CONCH_XRAY=$(/tmp/conch kernel path xray)"
            echo "CONCH_SING_BOX=$(/tmp/conch kernel path sing-box)"
          } >> "$GITHUB_ENV"
      - name: TUN, in a network namespace of its own
        shell: bash
        run: |
          go test -c -o /tmp/e2e.test ./internal/e2e
          sudo ip netns add nt
          sudo ip -n nt link set lo up
          sudo ip -n nt link add dummy0 type dummy
          sudo ip -n nt addr add 10.200.0.2/24 dev dummy0
          sudo ip -n nt link set dummy0 up
          sudo ip -n nt route add default via 10.200.0.1 dev dummy0
          # Programs in the namespace ask a resolver only TUN answers.
          sudo mkdir -p /etc/netns/nt
          echo "nameserver 10.200.0.53" | sudo tee /etc/netns/nt/resolv.conf
          sudo ip netns exec nt env CONCH_TUN_TEST=10.200.0.2 CONCH_MIHOMO="$CONCH_MIHOMO" CONCH_XRAY="$CONCH_XRAY" CONCH_SING_BOX="$CONCH_SING_BOX" \
            /tmp/e2e.test -test.run TestTUN -test.v -test.count=1 | tee tun.log
          if grep -- '--- SKIP' tun.log; then exit 1; fi
      - name: System service (systemd)
        shell: bash
        run: |
          mkdir -p ~/.config/conch
          printf 'routes: { default: DIRECT }\ninbound: { mixed-port: 7890 }\n' > ~/.config/conch/profile.yaml
          printf 'CONCH_PASSWORD=ci-service\n' > ~/.config/conch/.env
          sudo /tmp/conch service install --no-agent
          for i in $(seq 1 60); do /tmp/conch status 2>/dev/null | grep -q 运行中 && break; sleep 1; done
          /tmp/conch status
          /tmp/conch service status
          systemctl show conch -p User -p AmbientCapabilities -p WorkingDirectory
          test "$(curl -s -m 20 -x http://127.0.0.1:7890 -o /dev/null -w '%{http_code}' https://www.google.com/generate_204)" = 204
          sudo /tmp/conch service uninstall
          if systemctl is-active --quiet conch; then exit 1; fi
      - name: Autostart at login (systemd user service)
        shell: bash
        run: |
          # A user manager of our own, as a desktop login would start one.
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          for i in $(seq 1 30); do test -S "$XDG_RUNTIME_DIR/bus" && break; sleep 1; done
          install -D /tmp/conch ~/.local/bin/conch
          ~/.local/bin/conch autostart on
          for i in $(seq 1 60); do ~/.local/bin/conch status 2>/dev/null | grep -q 运行中 && break; sleep 1; done
          ~/.local/bin/conch status || { journalctl --user -u conch --no-pager | tail -50; exit 1; }
          ~/.local/bin/conch autostart status | tee status.txt
          grep -q active status.txt
          test "$(curl -s -m 20 -x http://127.0.0.1:7890 -o /dev/null -w '%{http_code}' https://www.google.com/generate_204)" = 204
          ~/.local/bin/conch autostart off
          if systemctl --user is-active --quiet conch; then exit 1; fi
          ~/.local/bin/conch autostart status | grep -q 没有开启
      - name: conch migrate, in a home an earlier version left
        shell: bash
        run: |
          # Releases before the XDG layout kept everything in ~/.local/share/conch,
          # and wrote the password to the .env where conch daemon ran.
          export HOME=$(mktemp -d)
          unset XDG_CONFIG_HOME XDG_DATA_HOME XDG_STATE_HOME XDG_CACHE_HOME XDG_RUNTIME_DIR
          old=$HOME/.local/share/conch
          mkdir -p $old/run $old/kernels/mihomo/v1 $HOME/work
          echo '{"backend":"xray"}' > $old/state.json
          echo '[]' > $old/pairings.json
          echo v1 > $old/kernels/mihomo/current
          echo kernel > $old/kernels/mihomo/v1/mihomo
          cd $HOME/work && echo CONCH_PASSWORD=ci-migrate > .env
          /tmp/conch migrate --dry-run | tee plan.txt
          test -f $old/state.json && test -f .env
          /tmp/conch migrate | tee done.txt
          # State leaves the data directory; the kernels stay in it, and nothing goes to ~/.cache.
          test -f $HOME/.local/state/conch/state.json && test -f $old/kernels/mihomo/v1/mihomo && test ! -e $HOME/.cache
          test -f $old/pairings.json && test ! -e $old/state.json && test ! -e $old/run && test ! -e .env
          grep -q CONCH_PASSWORD=ci-migrate $HOME/.config/conch/.env
          test "$(stat -c %a $HOME/.config/conch)" = 700
          /tmp/conch migrate | grep -q 没有需要迁移的文件

  # The daemon on Windows: controllers over unix sockets, Job Objects,
  # kernels' Windows builds.
  e2e-windows:
    name: e2e (windows, real kernels)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install mihomo, xray, sing-box and trojan-go
        shell: bash
        run: |
          go build -o conch.exe ./cmd/conch
          for k in mihomo sing-box trojan-go; do ./conch.exe kernel install $k; done
          ./conch.exe kernel install xray --geodata
          {
            echo "CONCH_MIHOMO=$(./conch.exe kernel path mihomo)"
            echo "CONCH_XRAY=$(./conch.exe kernel path xray)"
            echo "CONCH_XRAY_ASSETS=$USERPROFILE\\.local\\share\\conch\\home\\xray"
            echo "CONCH_SING_BOX=$(./conch.exe kernel path sing-box)"
            echo "CONCH_TROJAN_GO=$(./conch.exe kernel path trojan-go)"
          } >> "$GITHUB_ENV"
      - name: Kernels accept every golden config; daemon, API and sidecars work end to end
        shell: bash
        run: |
          go test -count=1 -v ./internal/backend/... ./internal/e2e ./internal/sidecar ./cmd/conch | tee e2e.log
          # Only the tests in Chrome may skip: Go cannot hand Chrome its
          # debugging pipe on Windows.
          if grep -- '--- SKIP' e2e.log | grep -v -e TestExtension -e TestWebUINodes -e TestWebUINodeForm; then exit 1; fi
      - name: Autostart at login (Run key), running with no console
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/at" && cd "$RUNNER_TEMP/at"
          printf 'routes: { default: DIRECT }\ninbound: { mixed-port: 7890 }\n' > profile.yaml
          printf 'CONCH_PASSWORD=ci-autostart\n' > .env
          "$GITHUB_WORKSPACE/conch.exe" autostart on
          for i in $(seq 1 60); do "$GITHUB_WORKSPACE/conch.exe" status 2>/dev/null | grep -q 运行中 && break; sleep 1; done
          "$GITHUB_WORKSPACE/conch.exe" status || { cat "$USERPROFILE/.local/state/conch/daemon.log" || true; exit 1; }
          "$GITHUB_WORKSPACE/conch.exe" autostart status | tee status.txt
          grep -q -- --autostart status.txt
          test "$(curl -s -m 20 -x http://127.0.0.1:7890 -o /dev/null -w '%{http_code}' https://www.google.com/generate_204)" = 204
          test -s "$USERPROFILE/.local/state/conch/daemon.log"
          "$GITHUB_WORKSPACE/conch.exe" autostart off
          "$GITHUB_WORKSPACE/conch.exe" autostart status | grep -q 没有开启
          taskkill //F //IM conch.exe || true
      - name: conch migrate moves the old places and points the Run key at the new ones
        shell: bash
        run: |
          # Where releases before the XDG layout kept things.
          cfg="$APPDATA/conch" data="$LOCALAPPDATA/conch" conch="$GITHUB_WORKSPACE/conch.exe"
          mkdir -p "$cfg" "$data/run"
          printf 'routes: { default: DIRECT }\ninbound: { mixed-port: 7890 }\n' > "$cfg/profile.yaml"
          printf 'CONCH_PASSWORD=ci-migrate\n' > "$cfg/.env"
          printf '[]\n' > "$data/pairings.json"
          cd "$RUNNER_TEMP"
          # The old profile still works, and autostart is registered with it.
          "$conch" autostart on 2>&1 | tee on.txt
          grep -q 旧位置 on.txt
          for i in $(seq 1 60); do "$conch" status 2>/dev/null | grep -q 运行中 && break; sleep 1; done
          "$conch" status
          taskkill //F //IM conch.exe || true
          for i in $(seq 1 30); do "$conch" status >/dev/null 2>&1 || break; sleep 1; done
          "$conch" migrate --dry-run | tee plan.txt
          test -f "$cfg/profile.yaml"
          "$conch" migrate | tee done.txt
          home="$(cygpath -u "$USERPROFILE")"
          test -f "$home/.config/conch/profile.yaml" && test -f "$home/.local/share/conch/pairings.json"
          test ! -e "$cfg" && test ! -e "$data"
          test -f "$(cygpath -u "$("$conch" kernel path mihomo)")" && test ! -e "$home/.cache/conch"
          grep -qF '.config\\conch\\.env' "$home/.local/state/conch/api.json"
          "$conch" autostart status | tee status.txt
          grep -qF '.config\conch\profile.yaml' status.txt
          "$conch" migrate | grep -q 没有需要迁移的文件
          "$conch" autostart off

  # The daemon on macOS: no death signal reaches the kernel (pid files
  # instead), unix socket paths are short, the kernels' darwin builds.
  e2e-macos:
    name: e2e (macos, real kernels and Chrome)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Build the browser extension
        working-directory: extension
        run: |
          npm ci
          npm run build
      - name: Install mihomo, xray, sing-box and trojan-go
        run: |
          go build -o /tmp/conch ./cmd/conch
          export CONCH_DATA_DIR="$RUNNER_TEMP/conch-data"
          for k in mihomo sing-box trojan-go; do /tmp/conch kernel install $k; done
          /tmp/conch kernel install xray --geodata
          {
            echo "CONCH_MIHOMO=$(/tmp/conch kernel path mihomo)"
            echo "CONCH_XRAY=$(/tmp/conch kernel path xray)"
            echo "CONCH_XRAY_ASSETS=$CONCH_DATA_DIR/home/xray"
            echo "CONCH_SING_BOX=$(/tmp/conch kernel path sing-box)"
            echo "CONCH_TROJAN_GO=$(/tmp/conch kernel path trojan-go)"
            echo "CONCH_CHROME=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
            echo "CONCH_EXTENSION=$PWD/extension/dist/chrome"
          } >> "$GITHUB_ENV"
      - name: Kernels accept every golden config; daemon, API, sidecars and extension work end to end
        shell: bash
        run: |
          # Tests use more loopback addresses, which macOS only has once added.
          sudo ifconfig lo0 alias 127.0.0.2 up
          sudo ifconfig lo0 alias 127.0.0.3 up
          sudo ifconfig lo0 alias 127.0.0.4 up
          go test -race -count=1 -v ./internal/backend/... ./internal/e2e ./internal/sidecar ./cmd/conch | tee e2e.log
          if grep -- '--- SKIP' e2e.log | grep -v TestTUN; then exit 1; fi
      - name: System proxy (networksetup) and system service (launchd)
        shell: bash
        run: |
          mkdir -p ~/.config/conch
          printf 'routes: { default: DIRECT }\ninbound: { mixed-port: 7890 }\n' > ~/.config/conch/profile.yaml
          printf 'CONCH_PASSWORD=ci-service\n' > ~/.config/conch/.env
          ready() { for i in $(seq 1 90); do /tmp/conch status 2>/dev/null | grep -q 运行中 && return; sleep 1; done; return 1; }
          # The switch points every network service at conch, and stopping
          # the daemon puts the settings back.
          /tmp/conch daemon > daemon.log 2>&1 &
          daemon=$!
          ready || { cat daemon.log; exit 1; }
          /tmp/conch sysproxy on
          scutil --proxy | tee during.txt
          grep -q 'HTTPEnable : 1' during.txt && grep -q 'HTTPPort : 7890' during.txt && grep -q 'SOCKSEnable : 1' during.txt
          kill -INT $daemon
          wait $daemon || true
          scutil --proxy | tee after.txt
          if grep -E 'HTTPEnable : 1|HTTPSEnable : 1|SOCKSEnable : 1' after.txt; then cat daemon.log; exit 1; fi
          # launchd: the service carries the profile, kernel and password.
          sudo /tmp/conch service install --no-agent
          ready || { sudo cat /Library/Logs/conch.log || true; exit 1; }
          /tmp/conch status
          /tmp/conch service status
          test "$(curl -s -m 20 -x http://127.0.0.1:7890 -o /dev/null -w '%{http_code}' https://www.google.com/generate_204)" = 204
          sudo /tmp/conch service uninstall
          if sudo launchctl print system/io.github.xiongnemo.conch.daemon >/dev/null 2>&1; then exit 1; fi
          # Autostart: a launch agent of the user's own, no sudo. A log an
          # earlier version left in ~/Library/Logs is used until conch migrate.
          mkdir -p ~/bin && cp /tmp/conch ~/bin/conch
          mkdir -p ~/Library/Logs/conch && echo 'old log' > ~/Library/Logs/conch/daemon.log
          ~/bin/conch autostart on
          ready || { cat ~/Library/Logs/conch/daemon.log || true; exit 1; }
          ~/bin/conch autostart status | tee status.txt
          grep -q 正在运行 status.txt
          test "$(curl -s -m 20 -x http://127.0.0.1:7890 -o /dev/null -w '%{http_code}' https://www.google.com/generate_204)" = 204
          plist=~/Library/LaunchAgents/io.github.xiongnemo.conch.user.plist
          grep -q "$HOME/Library/Logs/conch/daemon.log" $plist
          # Stopped but still registered: migrate moves the log and rewrites the agent.
          launchctl bootout gui/$(id -u)/io.github.xiongnemo.conch.user
          for i in $(seq 1 30); do /tmp/conch status >/dev/null 2>&1 || break; sleep 1; done
          ~/bin/conch migrate | tee migrate.txt
          state=${XDG_STATE_HOME:-$HOME/.local/state}/conch
          grep -q "$state/daemon.log" $plist
          test ! -e ~/Library/Logs/conch && grep -q 'old log' "$state/daemon.log" && test ! -e ~/.cache/conch
          ~/bin/conch autostart on
          ready || { cat "$state/daemon.log" || true; exit 1; }
          ~/bin/conch autostart off
          if launchctl print gui/$(id -u)/io.github.xiongnemo.conch.user >/dev/null 2>&1; then exit 1; fi

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Type check, test and build
        working-directory: extension
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      # Mozilla's linter checks the Firefox build the way addons.mozilla.org does.
      - name: Lint the Firefox build
        working-directory: extension
        run: npx --yes web-ext@8 lint --source-dir dist/firefox --self-hosted --warnings-as-errors
      # Unzip and load chrome/ (Chrome, Edge) or firefox/ as an unpacked extension.
      - uses: actions/upload-artifact@v7
        with:
          name: conch-extension
          path: extension/dist/
          retention-days: 14

  # Binaries of this commit for trying it out, one artifact per platform.
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.lite && ', lite' || '' }})
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: linux, goarch: arm64, lite: true }
          - { goos: linux, goarch: mipsle, lite: true }
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version comes from the tags
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        id: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          GOMIPS: softfloat
          TAGS: ${{ matrix.lite && 'lite' || '' }}
        run: |
          name=conch${TAGS:+-$TAGS}_${GOOS}_${GOARCH}
          if [ "$GOOS" = windows ]; then name=$name.exe; fi
          go build -trimpath -tags "$TAGS" -ldflags "-s -w $(scripts/version.sh --ldflags)" -o "out/$name" ./cmd/conch
          echo "file=out/$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.file }}
          archive: false
          retention-days: 14

  # What the release workflow does, without signing or publishing: every
  # target, the lite builds, packages and the extension zips.
  release:
    name: release dry run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          install-only: true
      - run: goreleaser check
      - run: goreleaser release --snapshot --clean --skip=sign
